name: Vitrin
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  Vitrin:
    type: application
    platform: iOS
    sources: [Vitrin]
    scheme: {}   # komut satırından (xcodebuild -scheme Vitrin) derlenebilsin diye paylaşılan şema
    info:
      path: Vitrin/Info.plist
      properties:
        CFBundleDisplayName: Vitrin
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true            # Ollama gibi yerel yapay zekâ için
          NSAllowsArbitraryLoadsInWebContent: true # gömülü oynatıcılar http kullanabiliyor
          NSAllowsArbitraryLoadsForMedia: true     # bazı akışlar http üzerinden geliyor
          NSExceptionDomains:
            doeda.com:                             # site yalnızca http sunuyor (https -> http yönlendiriyor)
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
            customcdn.org:                         # doeda küçük resimleri
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: Yerel ağdaki ücretsiz yapay zekâ sunucusuna (Ollama) bağlanmak için.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vitrin
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
