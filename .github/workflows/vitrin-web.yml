name: Vitrin web (profil ile kurulan sürüm)

# vitrin/web klasöründeki web uygulamasını test eder (birim testleri + gerçek tarayıcıda uçtan uca
# deneme) ve — Cloudflare anahtarları eklenmişse — yayınlar. Yayınlanınca iş özetinde uygulamanın
# adresi yazar; o adres iPhone'da Safari ile açılıp "Kur"a basılarak profil olarak kurulur.
on:
  push:
    branches: [ "main", "claude/**" ]
    paths: [ "vitrin/web/**", ".github/workflows/vitrin-web.yml" ]
  workflow_dispatch:

concurrency:
  group: vitrin-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testler ve tarayıcı denemesi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vitrin/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Birim testleri
        run: node --test tests/*.test.mjs

      - name: Tarayıcıda uçtan uca deneme (sahte verilerle)
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node tests/smoke.mjs "$GITHUB_WORKSPACE/ekranlar"

      - name: Çıktıları yükle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vitrin-web-${{ github.run_number }}
          path: |
            vitrin/web/site/
            ekranlar/
          if-no-files-found: warn

  yayinla:
    name: Yayınla (Cloudflare)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Yayın anahtarları eklenmiş mi?
        id: ayar
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "var=evet" >> "$GITHUB_OUTPUT"
          else
            echo "### Yayınlanmadı" >> "$GITHUB_STEP_SUMMARY"
            echo "CLOUDFLARE_API_TOKEN ve CLOUDFLARE_ACCOUNT_ID eklenmemiş. Adımlar: vitrin/web/README.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v5
        if: steps.ayar.outputs.var == 'evet'

      - uses: actions/setup-node@v5
        if: steps.ayar.outputs.var == 'evet'
        with:
          node-version: 22

      - name: Cloudflare'e yükle
        if: steps.ayar.outputs.var == 'evet'
        working-directory: vitrin/web
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee yayin.log
          ADRES=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' yayin.log | head -1 || true)
          {
            echo "### Yayınlandı"
            echo "Uygulama adresi: ${ADRES:-(yukarıdaki günlükte)}"
            echo "iPhone'da Safari ile bu adresi aç → **Kur** → Ayarlar > Profil İndirildi > Yükle."
          } >> "$GITHUB_STEP_SUMMARY"
