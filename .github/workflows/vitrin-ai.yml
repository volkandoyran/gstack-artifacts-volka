name: Vitrin — yapay zekâ danışması

# Ücretsiz yapay zekâ servislerine (GitHub Models üzerinden GPT ve diğerleri, Pollinations,
# anahtar eklenmişse Gemini) aynı soruyu sorar; yanıtları iş özetine ve indirilebilir çıktıya yazar.
# Gönderilen tek veri .github/ai/vitrin-istem.md dosyasıdır. Gemini için depo ayarlarına
# GEMINI_API_KEY adlı bir "secret" eklemek yeterlidir (aistudio.google.com'dan ücretsiz alınır).
on:
  workflow_dispatch:
  push:
    branches: [ "claude/**" ]
    paths: [ ".github/ai/vitrin-istem.md", ".github/workflows/vitrin-ai.yml" ]

permissions:
  contents: read
  models: read

jobs:
  sor:
    name: Modellere sor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: GitHub Models erişim tanılaması
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          govde='{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Sadece tamam yaz."}],"max_tokens":20}'
          govde2='{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Sadece tamam yaz."}],"max_tokens":20}'
          dene() { echo "== $1"; shift; curl -sS -m 40 -o yanit.txt -w "HTTP %{http_code} · %{content_type} · %{size_download} bayt\n" "$@" || true; head -c 400 yanit.txt; echo; }
          dene "models.github.ai (vnd.github+json)" -X POST https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -d "$govde"
          dene "models.github.ai (application/json)" -X POST https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/json" -H "Content-Type: application/json" -d "$govde"
          dene "models.github.ai / depo sahibi yolu" -X POST "https://models.github.ai/orgs/${GITHUB_REPOSITORY_OWNER}/inference/chat/completions" \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -d "$govde"
          dene "models.inference.ai.azure.com" -X POST https://models.inference.ai.azure.com/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$govde2"
          dene "katalog" https://models.github.ai/catalog/models -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json"

      - name: Modellere sor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          istem = open('.github/ai/vitrin-istem.md', encoding='utf-8').read()
          tok = os.environ['GITHUB_TOKEN']
          gemini_key = os.environ.get('GEMINI_API_KEY', '')

          def istek(url, govde=None, basliklar=None, zaman=150):
              veri = json.dumps(govde).encode() if govde is not None else None
              req = urllib.request.Request(url, data=veri, headers=basliklar or {}, method='POST' if veri else 'GET')
              with urllib.request.urlopen(req, timeout=zaman) as r:
                  return r.read().decode('utf-8', 'replace')

          sonuc, hatalar = [], []

          # 1) GitHub Models: GPT ve farklı yayıncılardan modeller; bulunmayan model atlanır.
          gh = {'Authorization': f'Bearer {tok}', 'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'}
          def github_models(model, metin, azami=1800):
              ham = istek('https://models.github.ai/inference/chat/completions',
                  {'model': model, 'messages': [{'role': 'user', 'content': metin}], 'max_tokens': azami}, gh)
              try:
                  return json.loads(ham)['choices'][0]['message']['content']
              except Exception as e:
                  raise RuntimeError(f'beklenmeyen yanıt ({len(ham)} bayt): {ham[:300]!r}') from e

          # Erişim denetimi: içerikten bağımsız kısa bir soru (hata ayıklamak için)
          try:
              print('ERISIM DENETIMI:', github_models('openai/gpt-4o-mini', 'Sadece "tamam" yaz.', 20))
          except urllib.error.HTTPError as e:
              print('ERISIM DENETIMI HATA: HTTP', e.code, e.read()[:400])
          except Exception as e:
              print('ERISIM DENETIMI HATA:', e)

          for model in ['openai/gpt-4.1', 'openai/gpt-4o', 'meta/Llama-4-Maverick-17B-128E-Instruct-FP8',
                        'mistral-ai/mistral-medium-2505', 'deepseek/DeepSeek-V3-0324', 'xai/grok-3-mini']:
              try:
                  sonuc.append((f'GitHub Models · {model}', github_models(model, istem)))
              except urllib.error.HTTPError as e:
                  hatalar.append(f'{model}: HTTP {e.code} {e.read()[:300]!r}')
              except Exception as e:
                  hatalar.append(f'{model}: {e}')

          # 2) Gemini (yalnızca GEMINI_API_KEY eklenmişse)
          if gemini_key:
              for model in ['gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-2.5-flash']:
                  try:
                      yanit = json.loads(istek(
                          f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent',
                          {'contents': [{'role': 'user', 'parts': [{'text': istem}]}]},
                          {'x-goog-api-key': gemini_key, 'Content-Type': 'application/json'}))
                      metin = ''.join(p.get('text', '') for p in yanit['candidates'][0]['content']['parts'])
                      sonuc.append((f'Gemini · {model}', metin))
                      break
                  except urllib.error.HTTPError as e:
                      hatalar.append(f'{model}: HTTP {e.code} {e.read()[:200]!r}')
                  except Exception as e:
                      hatalar.append(f'{model}: {e}')
          else:
              hatalar.append('Gemini: GEMINI_API_KEY eklenmemiş, atlandı')

          # 3) Pollinations (anahtarsız)
          try:
              metin = istek('https://text.pollinations.ai/openai',
                  {'model': 'openai', 'messages': [{'role': 'user', 'content': istem}]},
                  {'Content-Type': 'application/json'})
              try:
                  metin = json.loads(metin)['choices'][0]['message']['content']
              except Exception:
                  pass
              sonuc.append(('Pollinations · openai', metin))
          except Exception as e:
              hatalar.append(f'Pollinations: {e}')

          rapor = '# Vitrin — yapay zekâ önerileri\n\n' + '\n\n'.join(f'## {a}\n\n{y}' for a, y in sonuc)
          rapor += '\n\n## Yanıt vermeyenler\n\n' + ('\n'.join(f'- {h}' for h in hatalar) or '- yok') + '\n'
          os.makedirs('cikti', exist_ok=True)
          open('cikti/vitrin-oneriler.md', 'w', encoding='utf-8').write(rapor)
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write(rapor)
          print(rapor)
          PY

      - uses: actions/upload-artifact@v5
        with:
          name: vitrin-ai-oneriler-${{ github.run_number }}
          path: cikti/vitrin-oneriler.md
